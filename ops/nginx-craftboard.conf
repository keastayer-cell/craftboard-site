server {
    listen 80;
    listen [::]:80;
    server_name craftboard.online www.craftboard.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name craftboard.online www.craftboard.online;

    ssl_certificate /etc/letsencrypt/live/craftboard.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/craftboard.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/craftboard/current;
    index index.html;

    location = /api/status {
        proxy_pass http://127.0.0.1:9191/status;
        proxy_set_header Host $host;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
